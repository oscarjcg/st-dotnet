services:
  st-dotnet:
    image: ${DOCKER_REGISTRY-}stdotnet
    build:
      context: .
      dockerfile: st-dotnet/Dockerfile
    environment:
      - GalleryMySql__Conn=server=db;database=${MYSQL_DATABASE};user=${MYSQL_USER};password=${MYSQL_PASSWORD}
      - S3__AccessKeyId=${S3_ACCESS_KEY_ID}
      - S3__SecretKey=${S3_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    hostname: db
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db:
    driver: local
