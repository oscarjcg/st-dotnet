name: st-dotnet-test

x-app: &app
  build:
    context: .
    dockerfile: st-dotnet/Dockerfile
  image: st-dotnet-test-app
  environment: &app-env
    GalleryMySql__Conn: server=db;database=gallery_test;user=gallery_test;password=gallery_test
    S3__ServiceUrl: http://s3:9090
    S3__BucketName: st-test
    S3__PublicUrl: http://s3:9090/st-test/
    S3__AccessKeyId: s3-test
    S3__SecretKey: s3-test-secret
    NodeService__NewMessageUrl: ""

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: gallery_test
      MYSQL_USER: gallery_test
      MYSQL_PASSWORD: gallery_test
      MYSQL_ROOT_PASSWORD: root_test
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 5s
      retries: 40

  s3:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: st-test

  app:
    <<: *app
    environment:
      <<: *app-env
      ASPNETCORE_ENVIRONMENT: Development
      Testing__EnsureDatabaseCreated: "true"
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_started

  app-prod:
    <<: *app
    environment:
      <<: *app-env
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      app:
        condition: service_started

  unit-tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
      target: unit
    volumes:
      - ./test-results:/results

  ui-tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
      target: ui
    environment:
      APP_URL: http://app:8080
      APP_PROD_URL: http://app-prod:8080
    depends_on:
      app:
        condition: service_started
      app-prod:
        condition: service_started
    volumes:
      - ./test-results:/results
